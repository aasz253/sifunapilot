[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sifunapilot"
version = "0.1.0"
description = "Local-first AI computer operator - Your computer. Your commands. Your AI."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "aasz253", email = "aasz253@example.com"}
]
keywords = ["ai", "computer-automation", "browser-automation", "agent", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "asyncio>=3.4.3",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
    "pillow>=10.1.0",
    "opencv-python>=4.9.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.0.8",
    "python-docx>=1.1.0",
    "sqlalchemy>=2.0.25",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.1",
    "pre-commit>=3.6.0",
]

[project.scripts]
sifunapilot = "sifunapilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sifunapilot"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
